spring:
  datasource:
    url: ${E2E_DB_URL:jdbc:mysql://localhost:3307/career_platform_e2e?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${E2E_DB_USERNAME:root}
    password: ${E2E_DB_PASSWORD:root_local}

app:
  auth:
    jwt-secret: ${E2E_JWT_SIGNING_KEY:task10-e2e-signing-secret-32-bytes-minimum}
    refresh-cookie-secure: false
    trusted-origins: ${E2E_AUTH_TRUSTED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
