services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: career_platform
      MYSQL_USER: career_app
      MYSQL_PASSWORD: career_local
      MYSQL_ROOT_PASSWORD: root_local
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - career_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  career_mysql:
